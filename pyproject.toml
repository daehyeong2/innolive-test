[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "innolive-privacy-blur"
version = "0.1.0"
description = "WebRTC face privacy blur with reference-face exclusion."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "av>=11.0",
  "aiortc>=1.8",
  "aiohttp>=3.9",
  "ultralytics>=8.0",
  "torch>=2.0",
  "onnx>=1.17",
  "onnxruntime-gpu>=1.20; sys_platform == 'linux'",
  "onnxruntime>=1.20; sys_platform != 'linux'",
]

[tool.setuptools.packages.find]
include = ["privacy_blur*"]
